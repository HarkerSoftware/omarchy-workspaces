[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tylerharker/omarchy-workspaces"
rust-version = "1.90"

[workspace.dependencies]
workspace-core = { path = "crates/workspace-core" }
workspace-hypr = { path = "crates/workspace-hypr" }
workspace-proto = { path = "crates/workspace-proto" }
workspace-storage = { path = "crates/workspace-storage" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
notify = "8"
nucleo-matcher = "0.3"
regex = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "sync",
  "signal",
  "time",
  "process",
  "io-util",
  "macros",
] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# test-only
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
