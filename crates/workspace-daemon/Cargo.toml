[package]
name = "workspace-daemon"
description = "Background daemon for omarchy-workspaces: tracks Hyprland, owns state, serves the IPC socket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "workspace-daemon"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
notify = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
workspace-core = { workspace = true }
workspace-hypr = { workspace = true }
workspace-proto = { workspace = true }
workspace-storage = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
workspace-hypr = { workspace = true, features = ["fake"] }

[lints]
workspace = true
