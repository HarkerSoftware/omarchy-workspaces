version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "workspace-panel"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-channel = "2"
gtk4 = { version = "0.11", features = ["v4_12"] }
