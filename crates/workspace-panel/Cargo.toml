serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
workspace-core = { workspace = true }
workspace-proto = { workspace = true }
workspace-storage = { workspace = true }

[lints]
workspace = true
